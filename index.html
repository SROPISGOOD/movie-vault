<!DOCTYPE html>
<html>
<head>
    <title>Movie Website</title>
</head>

<body>

<h1>🎬 Movie Website</h1>

<h2>Add Movie</h2>

<input id="title" placeholder="Title"><br><br>
<input id="release" placeholder="Release Date"><br><br>
<input id="budget" placeholder="Budget"><br><br>
<input id="collection" placeholder="Collection"><br><br>
<input id="imdb" placeholder="IMDb Rating"><br><br>
<input id="audience" placeholder="Audience Rating"><br><br>

<textarea id="review" placeholder="Review"></textarea>
<br><br>

<button onclick="addMovie()">Add Movie</button>

<hr>

<div id="movies"></div>

<script>

function addMovie() {

    let movie = document.createElement("div");

    movie.innerHTML = `
        <h2>${document.getElementById("title").value}</h2>

        <p>Release Date: ${document.getElementById("release").value}</p>
        <p>Budget: ${document.getElementById("budget").value}</p>
        <p>Collection: ${document.getElementById("collection").value}</p>
        <p>IMDb Rating: ${document.getElementById("imdb").value}</p>
        <p>Audience Rating: ${document.getElementById("audience").value}</p>
        <p>Review: ${document.getElementById("review").value}</p>

        <button onclick="this.parentElement.remove()">Delete</button>

        <hr>
    `;

    document.getElementById("movies").appendChild(movie);
}

</script>

</body>
</html>
