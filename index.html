<!DOCTYPE html>
<html>
<head>
    <title>Movie Website</title>
</head>

<body>

    <h1>🎬 My Movie Website</h1>

    <h2>Movie Details</h2>

    <input id="title" placeholder="Movie Title"><br><br>
    <input id="release" placeholder="Release Date"><br><br>
    <input id="budget" placeholder="Budget"><br><br>
    <input id="collection" placeholder="Collection"><br><br>
    <input id="imdb" placeholder="IMDb Rating"><br><br>
    <input id="audience" placeholder="Audience Rating"><br><br>
    <textarea id="review" placeholder="Review"></textarea><br><br>

    <button onclick="addMovie()">Add Movie</button>

    <hr>

    <div id="movies"></div>

    <script>

        let movies = [];

        function addMovie() {

            let movie = {
                title: document.getElementById("title").value,
                release: document.getElementById("release").value,
                budget: document.getElementById("budget").value,
                collection: document.getElementById("collection").value,
                imdb: document.getElementById("imdb").value,
                audience: document.getElementById("audience").value,
                review: document.getElementById("review").value
            };

            movies.push(movie);

            displayMovies();
        }

        function displayMovies() {

            let output = "";

            movies.forEach((movie, index) => {

                output += `
                    <h2>${movie.title}</h2>

                    <p>Release Date: ${movie.release}</p>
                    <p>Budget: ${movie.budget}</p>
                    <p>Collection: ${movie.collection}</p>
                    <p>IMDb Rating: ⭐ ${movie.imdb}</p>
                    <p>Audience Rating: ⭐ ${movie.audience}</p>
                    <p>Review: ${movie.review}</p>

                    <button onclick="deleteMovie(${index})">
                        🗑️ Delete
                    </button>

                    <hr>
                `;
            });

            document.getElementById("movies").innerHTML = output;
        }

        function deleteMovie(index) {

            movies.splice(index, 1);

            displayMovies();
        }

    </script>

</body>
</html>
